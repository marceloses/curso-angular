<div class="container">
  <div class="calculator-card">
    <h2>Calculadora</h2>

    <div class="input-row">
      <label>
        Número 1
        <input type="number" [(ngModel)]="numero1" placeholder="Digite o primeiro número" />
      </label>

      <label>
        Número 2
        <input type="number" [(ngModel)]="numero2" placeholder="Digite o segundo número" />
      </label>

      <div class="operation-field">
        <span>Operação</span>
        <div class="operation-buttons">
          <button
            type="button"
            *ngFor="let operacao of operacoes"
            [class.active]="operador === operacao.valor"
            [attr.aria-pressed]="operador === operacao.valor"
            (click)="selecionarOperador(operacao.valor)"
          >
            <strong>{{ operacao.simbolo }}</strong>
            <small>{{ operacao.descricao }}</small>
          </button>
        </div>
      </div>
    </div>

    <div class="button-row">
      <button type="button" (click)="calcular()">Calcular</button>
      <button type="button" class="secondary" (click)="limpar()">Limpar</button>
    </div>

    <div class="result-card">
      <p class="status" *ngIf="mensagem">{{ mensagem }}</p>
      <p *ngIf="resultado !== null" class="result-text">
        <strong>Resultado:</strong>
        {{ expressao }} =
        <span>{{ resultado }}</span>
      </p>
      <p *ngIf="resultado === null && !mensagem" class="hint">
        Preencha os valores, escolha a operação e clique em Calcular.
      </p>
    </div>
  </div>
</div>
