<div class="container">
  <div class="calculator-card">
    <h2>Calculadora</h2>

    <div class="input-row">
      <label>
        Número 1
        <input type="number" [(ngModel)]="numero1" placeholder="Digite o primeiro número" />
      </label>

      <label>
        Número 2
        <input type="number" [(ngModel)]="numero2" placeholder="Digite o segundo número" />
      </label>
    </div>

    <div class="button-row">
      <button type="button" (click)="calcular('+')">+</button>
      <button type="button" (click)="calcular('-')">-</button>
      <button type="button" (click)="calcular('*')">×</button>
      <button type="button" (click)="calcular('/')">÷</button>
      <button type="button" class="secondary" (click)="limpar()">Limpar</button>
    </div>

    <div class="result-card">
      <p class="status" *ngIf="mensagem">{{ mensagem }}</p>
      <p *ngIf="resultado !== null" class="result-text">
        <strong>Resultado:</strong>
        {{ expressao }} =
        <span>{{ resultado }}</span>
      </p>
      <p *ngIf="resultado === null && !mensagem" class="hint">
        Selecione uma operação para calcular.
      </p>
    </div>
  </div>
</div>
